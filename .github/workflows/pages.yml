# Déploie la maquette statique sur GitHub Pages (sans le dossier wp-theme, non exécutable côté Pages).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer le site statique
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='wp-theme' \
            --exclude='.gitignore' \
            ./ _site/
          # Assets du configurateur salle de bain (référencés par devis-sdb-embed.html) — le PHP du thème n'est pas publié.
          mkdir -p _site/wp-theme/labienveillance/assets/css
          mkdir -p _site/wp-theme/labienveillance/assets/js
          cp wp-theme/labienveillance/assets/css/devis-sdb.css _site/wp-theme/labienveillance/assets/css/
          cp wp-theme/labienveillance/assets/js/devis-sdb.js _site/wp-theme/labienveillance/assets/js/

      - name: Configurer Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
